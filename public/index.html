<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ananya's next read</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <button class="brand" id="home-button" aria-label="Ananya's next read, home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C8 2 4 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-2-1-6-2-10 1zM12 5v16M5 7c1.5-.3 3 .1 4 1M5 10c1.5-.3 3 .1 4 1M15 8c1-.9 2.5-1.3 4-1M15 11c1-.9 2.5-1.3 4-1"/></svg>
      <span>Ananya's next read</span>
    </button>
    <label class="tools">Season
      <select id="season">
        <option value="autumn">Autumn</option>
        <option value="winter">Winter</option>
        <option value="spring">Spring</option>
        <option value="summer">Summer</option>
      </select>
    </label>
  </header>

  <!-- Only one screen is visible; hidden screens are also excluded from keyboard navigation. -->
  <main>
    <section class="home" id="home">
      <h1><span class="intro-line">Hello, world's most unpredictable</span><span class="mood-line">mood reader.</span><em>Let's find your next book.</em></h1>
      <button class="primary" id="recommend">Recs please!</button>
      <picture class="shelf" aria-hidden="true">
        <source media="(max-width: 1024px)" srcset="assets/bookshelf-tall.png">
        <img class="shelf-art" src="assets/bookshelf-preview.png" alt="">
      </picture>
    </section>
    <section class="loading" id="loading" aria-label="Finding recommendations" hidden>
      <div class="motion" id="motion" aria-hidden="true"></div>
      <p role="status" id="loading-copy"></p>
      <p class="load-error" id="load-error" role="alert" hidden></p>
      <button class="text-button" id="skip" disabled>Show picks</button>
      <button class="text-button" id="retry" hidden>Try again</button>
    </section>
    <section class="results" id="results" hidden>
      <div class="results-top">
        <button class="text-button" id="refresh">Find picks again</button>
      </div>
      <h1 id="heading" tabindex="-1"></h1>
      <p class="sub" id="summary"></p>
      <p class="data-warning" id="data-warning" role="alert" hidden></p>
      <div class="grid" id="grid"></div>
      <p class="sub" id="empty" hidden>No checked books fit right now. They may be read, deferred, have 5 or more holds, or need a fresh availability check.</p>
      <p class="footnote" id="footnote"></p>
    </section>
  </main>

  <!-- Static markup is cloned for each book; imported text is assigned safely in app.js. -->
  <template id="book-card">
    <article class="card">
      <div class="tag">From your TBR</div>
      <h2 data-field="title"></h2>
      <p class="author" data-field="author"></p>
      <p class="description" data-field="description"></p>
      <p class="reason" data-field="reason"></p>
      <div class="availability" data-field="availability"></div>
      <p class="location" data-field="location"></p>
      <p class="checked" data-field="checked"></p>
      <div class="actions">
        <button type="button" data-action="skip">Not today</button>
        <button type="button" data-action="read">Read already</button>
        <a target="_blank" rel="noopener noreferrer">Request from SPL &#8599;</a>
        <span class="ebook-note" hidden>Ebook only at SPL</span>
      </div>
    </article>
  </template>
  <div class="notice" id="notice" role="status" hidden></div>
</body>
</html>
